
{% extends "base.html" %}

{% block titulo %}Entrar | Game Library{% endblock %}

{% block conteudo %}

<div class="pagina-autenticacao">

    <div class="cartao-autenticacao">

        <!-- LOGO E APRESENTAÇÃO -->

        <div class="logo-autenticacao">

            <span class="logo-icone">🎮</span>

            <h1>Game Library</h1>

            <p>Entre na sua conta para acessar sua coleção de jogos.</p>

        </div>


        <!-- FORMULÁRIO DE LOGIN -->

        <form
            class="formulario-autenticacao"
            method="POST"
            action="{{ url_for('autenticacao.login') }}"
        >

            <!-- CAMPO E-MAIL -->

            <div class="campo-autenticacao">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <!-- CAMPO SENHA -->

            <div class="campo-autenticacao">

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


            <!-- BOTÃO ENTRAR -->

            <button type="submit" class="botao-autenticacao">
                Entrar
            </button>

        </form>


        <!-- LINK PARA CADASTRO -->

        <div class="link-autenticacao">

            Ainda não possui uma conta?

            <a href="{{ url_for('autenticacao.cadastro') }}">
                Criar conta
            </a>

        </div>

    </div>

</div>

{% endblock %}
