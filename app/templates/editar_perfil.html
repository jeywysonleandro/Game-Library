{% extends "base.html" %}

{% block titulo %}Editar perfil | Game Library{% endblock %}

{% block conteudo %}

<section class="pagina-perfil">

    <!-- CABEÇALHO -->

    <div class="cabecalho-pagina">

        <div>
            <h1>Editar perfil</h1>
            <p>Atualize as informações da sua conta.</p>
        </div>

    </div>


    <!-- FORMULÁRIO -->

    <div class="cartao-perfil">

        <form method="POST" class="formulario-perfil">

            <div class="campo-formulario">

                <label for="nome">Nome completo</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ usuario['nome'] }}"
                    placeholder="Digite seu nome"
                    required
                >

            </div>


            <div class="campo-formulario">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ usuario['email'] }}"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <!-- BOTÕES -->

            <div class="acoes-formulario">

                <a href="{{ url_for('principal.perfil') }}" class="botao-cancelar">
                    Cancelar
                </a>

                <button type="submit" class="botao-salvar">
                    Salvar alterações
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
